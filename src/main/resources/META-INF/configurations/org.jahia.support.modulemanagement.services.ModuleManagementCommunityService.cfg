# default configuration - won't be overridden
updateOnModuleStartup = false

excludedModules = org.apache.karaf, org.apache.felix

# Maximum number of modules to update in one go, 0 means no limit
maxModulesToUpdate = 10

# URL of the Jahia store module catalogue JSON (source of truth for Jahia module update detection).
#
# SECURITY (JAHIA-SEC-271, CWE-918): this value is fetched by the Jahia JVM, so it is an SSRF sink.
# It is vetted before every request — and again on every redirect hop — against a fixed policy:
#   * https only;
#   * no credentials embedded in the URL;
#   * the host must not resolve to a loopback, wildcard, link-local (incl. the 169.254.169.254 cloud
#     metadata endpoint), private, unique-local, carrier-grade-NAT, multicast or reserved address.
# A rejected value is logged at ERROR and replaced by the default below; the module then serves the
# catalogue bundled in the jar.
#
# The policy is deliberately not configurable here: an allow-list living in this file would be
# writable by anything able to write this file. Operators running an internal store mirror relax it
# with a system property instead, which also permits plain http:
#   -Djahia.modulemanagement.storeIndex.allowInternalHosts=true
# An OSGi configuration write cannot set that property, but it is read live, so anything that can
# call System.setProperty (Karaf console, JMX, another bundle) or edit karaf/etc/system.properties
# can. See the README for the full list of residual gaps.
storeModuleListUrl = https://store.jahia.com/en/sites/private-app-store/contents/modules-repository.moduleList.json
