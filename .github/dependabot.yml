version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Jahia parent / platform artifacts define the target Jahia version
      - dependency-name: "org.jahia.*"
      # OSGi spec artifacts change Require-Capability / Import-Package ranges
      - dependency-name: "org.osgi:*"
      # Platform-provided (scope provided): must match what Jahia 8.2 ships
      - dependency-name: "javax.servlet:javax.servlet-api"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.ops4j.pax.url:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.graphql-java*:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.github.graphql-java:*"
        update-types: ["version-update:semver-major"]
      # Embedded resolver stack stays on the Maven 3.9 / Resolver 1.9 line
      - dependency-name: "org.apache.maven.resolver:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.maven:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.eirslett:frontend-maven-plugin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Module Federation shared libraries: majors must follow the Jahia platform
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-redux"
        update-types: ["version-update:semver-major"]
      # Tooling majors that need migrations (Babel 8, ESLint flat config, TS 7)
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @jahia/stylelint-config only supports stylelint 13
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-tests-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
